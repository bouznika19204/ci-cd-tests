name: Ma première CI/CD

on:
  push:
    tags:
      - 'dev-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  sca:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: SCA scan (npm audit)
        run: npm audit --audit-level=high || true

  sast:
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20.x
      - name: SAST scan (eslint)
        run: npx eslint . || true

  deploy:
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: ttskch/render-deploy@v1.0.0
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: srv-d5pie5fgi27c73fob2bg

  notify:
    runs-on: ubuntu-latest
    needs: [build, sca, sast, deploy]
    if: always()
    steps:
      - name: Notify Discord
        run: |
          STATUS="SUCCESS"
          if [[ "${{ needs.deploy.result }}" != "success" ]]; then
            STATUS="FAILED"
          fi

          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"🚀 CI/CD: $STATUS - Repo ${{ github.repository }} - Tag ${{ github.ref_name }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
