name: Ma première CI/CD

on:
  push:
    tags:
      - 'dev-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SCA
      - name: SCA - Audit des dépendances
        run: npm audit --audit-level=high

      # SAST
      - name: SAST - Scan du code source (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # NOTIFY DISCORD SI ECHEC
      - name: Notify Discord (failure)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"❌ CI FAILED - Repo ${{ github.repository }} - Tag ${{ github.ref_name }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: ttskch/render-deploy@v1.0.0
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: srv-d5pie5fgi27c73fob2bg
